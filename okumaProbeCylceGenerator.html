<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Okuma Hole Probe Generator</title>
<style>
  :root { --bg:#eef0f2; --panel:#fff; --ink:#1c2227; --mute:#5d6872; --line:#cfd5da; --accent:#0b5cad; --accent-ink:#fff; --code:#14181c; --code-ink:#d6e2ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181c; --panel:#1d2329; --ink:#e6ebef; --mute:#93a0ab; --line:#333c44; --accent:#5aa2e8; --accent-ink:#0c1620; --code:#0d1013; --code-ink:#c8d8e6; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { max-width:1000px; margin:0 auto; display:grid; gap:16px; grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
  @media (max-width:760px) { main { grid-template-columns:1fr; } }
  h1 { font-size:20px; margin:0 0 4px; grid-column:1/-1; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px; }
  h2 { font-size:15px; margin:0 0 10px; }
  label { display:block; font-size:13px; color:var(--mute); margin-bottom:3px; }
  input { width:100%; padding:7px 8px; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--ink); font:inherit; }
  input:focus, button:focus-visible, textarea:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .full { grid-column:1/-1; }
  .hole { display:grid; grid-template-columns:auto 1fr 1fr auto; gap:8px; align-items:end; margin-bottom:8px; }
  .hole b { padding-bottom:8px; min-width:92px; font-weight:600; }
  .hole small { display:block; color:var(--mute); font-weight:400; }
  button { padding:8px 12px; border:1px solid var(--line); border-radius:4px; background:var(--panel); color:var(--ink); font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  button.x { padding:7px 10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  textarea { width:100%; height:430px; resize:vertical; padding:10px; border:1px solid var(--line); border-radius:4px; background:var(--code); color:var(--code-ink); font:13px/1.4 ui-monospace, Consolas, monospace; white-space:pre; }
  #msg { margin-top:8px; font-size:13px; color:var(--mute); min-height:18px; }
</style>
</head>
<body>
<main>
  <h1>Okuma hole probe generator</h1>

  <div style="display:grid;gap:16px;align-content:start">
    <section>
      <h2>Program settings</h2>
      <div class="grid">
        <div class="full"><label for="name">Program comment (first line)</label><input id="name" value="ProbingCycle"></div>
        <div><label for="startWo">Starting work offset (PS and G15 H)</label><input id="startWo" type="number" min="1" step="1" value="1"></div>
        <div><label for="pf">Probe feed (PF)</label><input id="pf" value="30.0"></div>
        <div><label for="approach">Approach Z before probing</label><input id="approach" value="0.25"></div>
        <div><label for="nominal">Nominal Z (probed surface)</label><input id="nominal" value="0"></div>
        <div class="full"><label for="retract">Retract Z (PZ)</label><input id="retract" value="2"></div>
      </div>
    </section>

    <section>
      <h2>Holes</h2>
      <div id="holes"></div>
      <div class="row"><button id="add">Add hole</button><button id="import">Import from NC file</button><input id="file" type="file" hidden></div>
      <div id="hmsg" style="margin-top:8px;font-size:13px;color:var(--mute)"></div>
    </section>
  </div>

  <section>
    <h2>Program</h2>
    <textarea id="out" spellcheck="false" readonly></textarea>
    <div class="row">
      <button class="primary" id="save">Save program</button>
      <button id="copy">Copy</button>
    </div>
    <div id="msg"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let holes = [{x:"2", y:"0"}, {x:"8", y:"0"}];

function renderHoles() {
  const start = parseInt($("startWo").value) || 1;
  $("holes").innerHTML = "";
  holes.forEach((h, i) => {
    const row = document.createElement("div");
    row.className = "hole";
    row.innerHTML =
      `<b>Hole ${i + 1}<small>work offset ${start + i}</small></b>` +
      `<div><label>X</label><input data-i="${i}" data-k="x" value="${h.x}"></div>` +
      `<div><label>Y</label><input data-i="${i}" data-k="y" value="${h.y}"></div>` +
      `<button class="x" data-del="${i}" aria-label="Remove hole ${i + 1}">&times;</button>`;
    $("holes").appendChild(row);
  });
}

function build() {
  const v = id => $(id).value.trim();
  const start = parseInt(v("startWo")) || 1;
  const L = [];
  L.push(`(${v("name")})`, "(PROGRAM SET-UP)", "G40 G80", "G90", "G0 Z999.999",
         "IF[VTLCN EQ 99]N10", "G116T=99", "N10", `G15H${start}`, "G56 HA");
  holes.forEach((h, i) => {
    const x = h.x.trim() || "0", y = h.y.trim() || "0";
    L.push("");
    if (i > 0) L.push("(**********************************)");
    L.push(`(HOLE ${i + 1} - WORK OFFSET ${start + i})`);
    L.push(`G0 X${x} Y${y}`);
    if (i === 0) L.push(`Z${v("retract")}`);
    L.push("G56 H99", "CALL O9832");
    L.push(`CALL O9810 PX=${x} PY=${y} PF=${v("pf")}`);
    L.push(`CALL O9810 PZ=${v("approach")}`);
    L.push(`CALL O9811 PS=${start + i} PZ=${v("nominal")}`);
    L.push("(RETRACT MOVE)", `CALL O9810 PZ=${v("retract")}`);
  });
  L.push("", "(PROGRAM END)", "G90", "CALL O9833", "G0 Z=VPPLZ", "G0 X=VNPLX Y=VPPLY", "M30", "%");
  return L.join("\n") + "\n";
}

function refresh() { $("out").value = build(); }

$("holes").addEventListener("input", e => {
  const i = e.target.dataset.i, k = e.target.dataset.k;
  if (i !== undefined) { holes[i][k] = e.target.value; refresh(); }
});
$("holes").addEventListener("click", e => {
  const d = e.target.closest("[data-del]");
  if (!d || holes.length < 2) return;
  holes.splice(+d.dataset.del, 1);
  renderHoles(); refresh();
});
$("add").onclick = () => {
  const last = holes[holes.length - 1] || {x:"0", y:"0"};
  holes.push({x:"", y:last.y});
  renderHoles(); refresh();
  const ins = $("holes").querySelectorAll('input[data-k="x"]');
  ins[ins.length - 1].focus();
};
document.querySelectorAll(".grid input, #name").forEach(el => el.addEventListener("input", () => {
  if (el.id === "startWo") renderHoles();
  refresh();
}));

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("out").value); $("msg").textContent = "Copied."; }
  catch { $("out").select(); document.execCommand("copy"); $("msg").textContent = "Copied."; }
};

$("save").onclick = async () => {
  const text = $("out").value;
  const suggested = ($("name").value.trim().replace(/[^\w\-]+/g, "_") || "PROBETEST") + ".MIN";
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: suggested,
        types: [
          { description: "Okuma program (.MIN)", accept: { "text/plain": [".MIN"] } },
          { description: "NC file (.NC)", accept: { "text/plain": [".NC"] } },
          { description: "Text file (.TXT)", accept: { "text/plain": [".TXT"] } }
        ]
      });
      const w = await handle.createWritable();
      await w.write(text); await w.close();
      $("msg").textContent = "Saved " + handle.name;
      return;
    } catch (err) {
      if (err.name === "AbortError") return;
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type:"text/plain"}));
  a.download = suggested; a.click();
  URL.revokeObjectURL(a.href);
  $("msg").textContent = "Downloaded " + suggested + " (this browser has no save dialog, so it went to Downloads).";
};

function parseNC(text) {
  const ops = []; let cur = null, mx = null, my = null;
  for (const raw of text.split(/\r?\n/)) {
    const l = raw.replace(/\(.*?\)/g, "").trim().toUpperCase();
    if (!l || l === "%") continue;
    if (/G116\s*T\d/.test(l)) {
      cur = { tool: (l.match(/T(\d+)/) || [])[1], wo: null, pts: [] };
      ops.push(cur); mx = my = null; continue;
    }
    if (!cur) continue;
    const g = l.match(/G15\s*H(\d+)/); if (g) cur.wo = +g[1];
    const xm = l.match(/(?:^|[^A-Z])X(-?\d*\.?\d+)/), ym = l.match(/(?:^|[^A-Z])Y(-?\d*\.?\d+)/);
    if (xm) mx = xm[1]; if (ym) my = ym[1];
    if ((xm || ym) && mx !== null && my !== null) cur.pts.push({ x: mx, y: my });
  }
  const byTool = {};
  ops.filter(o => o.pts.length === 1 && o.wo !== null).forEach(o => (byTool[o.tool] = byTool[o.tool] || []).push(o));
  const best = Object.values(byTool).sort((a, b) => b.length - a.length)[0];
  const multi = ops.filter(o => o.pts.length > 1).sort((a, b) => b.pts.length - a.pts.length)[0];
  let list = null, source = "";
  if (best && best.length >= 2) {
    list = best.map(o => ({ x: o.pts[0].x, y: o.pts[0].y, wo: o.wo }));
    source = "the individual T" + best[0].tool + " ops";
  } else if (multi) {
    list = multi.pts.map(p => ({ ...p, wo: null }));
    source = "the multi-hole op (T" + multi.tool + ")";
  }
  return { list, multi, source };
}

$("import").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const r = parseNC(await f.text()); e.target.value = "";
  if (!r.list || !r.list.length) { $("hmsg").textContent = "No hole positions found in that file."; return; }
  holes = r.list.map(h => ({ x: h.x, y: h.y }));
  if (r.list[0].wo != null) $("startWo").value = r.list[0].wo;
  renderHoles(); refresh();
  const notes = [`${holes.length} holes from ${r.source}.`];
  if (r.list[0].wo != null && r.list.some((h, i) => h.wo !== r.list[0].wo + i))
    notes.push("Warning: the file's offsets are not consecutive, but this tool numbers them consecutively.");
  if (r.multi && r.list[0].wo != null) {
    const key = a => a.map(p => (+p.x).toFixed(4) + "," + (+p.y).toFixed(4)).sort().join("|");
    notes.push(key(r.list) === key(r.multi.pts) ? "Matches the spot/drill positions." : "Warning: differs from the spot/drill positions.");
  }
  $("hmsg").textContent = notes.join(" ");
};

renderHoles(); refresh();
</script>
</body>
</html>
